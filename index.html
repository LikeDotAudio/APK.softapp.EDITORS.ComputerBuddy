<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer & Server Node Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <!-- THE ONE TABLE (FrontEnd/shared/apk-table.*, vendored; check.sh webshared) -->
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <style>
    .apk-table-host { flex: 1; min-height: 0; display: flex; margin-bottom: 16px; }
    .split-layout {
      display: grid;
      grid-template-columns: 300px 320px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
      padding: 16px;
      overflow: hidden;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .field-group {
      margin-bottom: 12px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #888888);
      margin-bottom: 5px;
    }
    .field-group input, .field-group select {
      width: 100%;
      background: var(--surface-bg, #121212);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 4px;
      color: var(--text-bright, #f4f4f5);
      padding: 7px 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      border-radius: 6px;
      border: 1px solid var(--border-color, #2c2c2c);
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0f0f11);
      color: var(--text-muted, #888888);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      color: var(--text-bright, #f4f4f5);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .service-badge {
      display: inline-flex;
      align-items: center;
      background: #2c2c2c;
      border: 1px solid #2B3C5D;
      color: var(--text-bright, #f4f4f5);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin: 4px 6px 4px 0;
    }
    .badge-remove {
      background: none;
      border: none;
      color: #FF5A5A;
      font-size: 14px;
      font-weight: bold;
      margin-left: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .badge-remove:hover {
      color: #FF8080;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
    body.net-hidden .split-layout { grid-template-columns: 320px 1fr; }
    body.net-hidden #net-panel { display: none; }
    #net-status { font-size: 11px; padding: 8px 12px; color: var(--text-muted, #888); border-bottom: 1px solid var(--border-color, #2c2c2c); }
    #net-status[data-apk-state="dead"] { color: var(--apk-state-dead); }
    .net-tools { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border-color, #2c2c2c); }
    .net-tools input, .net-tools select { flex: 1; min-width: 0; background: var(--bg-input, #0f0f11); border: 1px solid var(--border-color, #2c2c2c); border-radius: 4px; color: var(--text-main, #f4f4f5); padding: 5px 8px; font-size: 12px; }
    #net-list { flex: 1; overflow-y: auto; padding: 6px; }
    .net-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 8px; color: var(--text-main, #f4f4f5); cursor: pointer; font: inherit; }
    .net-row:hover { background: var(--bg-surface-hover, #222226); }
    .net-row.selected { border-color: var(--apk-accent); background: var(--apk-accent-tint, rgba(244,144,44,.12)); }
    .net-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--apk-state-kinda); }
    .net-dot[data-apk-state="good"] { background: var(--apk-state-good); }
    .net-dot[data-apk-state="dead"] { background: var(--apk-state-dead); }
    .net-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .net-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .net-sub { font-size: 11px; color: var(--text-muted, #888); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .net-tier { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; padding: 2px 6px; border-radius: 8px; border: 1px solid var(--border-light, #3f3f46); color: var(--text-muted, #888); flex: none; }
    .net-tier.tier-computer { color: var(--apk-accent); border-color: var(--apk-accent); }
    .net-empty { color: var(--text-muted, #888); font-size: 12px; padding: 12px; }
    #net-why { border-top: 1px solid var(--border-color, #2c2c2c); padding: 10px 12px; font-size: 12px; max-height: 40%; overflow-y: auto; }
    #net-why .why-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    #net-why .why-sub { color: var(--text-muted, #888); margin-bottom: 4px; }
    #net-why ul { margin: 0; padding-left: 16px; }
    #net-why b.plus { color: var(--apk-state-good); }
    #net-why b.minus { color: var(--apk-state-dead); }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🖥️</span>
      <span class="window-text">Computer & Server Node Buddy</span>
      <span id="block-tag" class="block-tag">COMPUTE NODE BLOCK</span>
    </div>
    <div class="window-actions">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action" title="Show / hide the real computers on the network">🖧 Network</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- The real computers on the network, live from the bus -->
    <div class="panel" id="net-panel">
      <div class="panel-header"><span>On the network</span></div>
      <div id="net-status" data-apk-state="kinda">Starting…</div>
      <div class="net-tools">
        <select id="net-filter" title="Which machines to list">
          <option value="computers">Computers &amp; likely</option>
          <option value="agents">Reports itself only</option>
          <option value="unsure">Include unsure</option>
          <option value="all">Everything on the bus</option>
        </select>
        <input id="net-search" type="search" placeholder="name, IP, MAC">
      </div>
      <div id="net-list"></div>
      <div id="net-why"></div>
    </div>
    <!-- Properties sidebar -->
    <div class="panel">
      <div class="panel-header">
        <span>Hardware & Node Spec</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <label>Hostname / Node ID</label>
          <input type="text" id="prop-hostname" value="SRV-AUD-01">
        </div>
        <div class="field-group">
          <label>Chassis / Form Factor</label>
          <select id="prop-formFactor">
            <option value="1U Rackmount">1U Rackmount</option>
            <option value="2U Rackmount">2U Rackmount</option>
            <option value="4U Rackmount">4U Rackmount</option>
            <option value="Blade Node">Blade Node</option>
            <option value="Mini-PC / NUC">Mini-PC / NUC</option>
            <option value="Virtual Machine / LXC">Virtual Machine / LXC</option>
            <option value="Desktop / Tower">Desktop / Tower</option>
            <option value="Laptop">Laptop</option>
            <option value="Single-Board Computer">Single-Board Computer</option>
            <option value="Unknown">Unknown</option>
          </select>
        </div>
        <div class="field-group">
          <label>Operating System</label>
          <input type="text" id="prop-os" value="Debian 12 Bookworm">
        </div>
        <div class="field-group">
          <label>CPU Processor</label>
          <input type="text" id="prop-cpu" value="AMD EPYC 7302P 16-Core">
        </div>
        <div class="field-group">
          <label>System RAM</label>
          <input type="text" id="prop-ram" value="64 GB ECC DDR4">
        </div>
        <div class="field-group">
          <label>GPU Acceleration</label>
          <input type="text" id="prop-gpu" value="None (Headless)">
        </div>
        <div class="field-group">
          <label>Storage Array</label>
          <input type="text" id="prop-storage" value="2x 1TB NVMe RAID-1">
        </div>
        <div class="field-group">
          <label>Max Power Budget (Watts)</label>
          <input type="number" id="prop-powerWatts" value="250">
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="panel">
      <div class="panel-header">
        <span id="display-node-title">Node Network Interfaces & Daemons</span>
        <button id="btn-add-iface" class="btn-action btn-small">+ Add Interface</button>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="chassis-svg" class="svg-viewport"></div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Network Interfaces & VLANs</div>
        <div id="iface-table" class="apk-table-host"></div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Active Daemons & System Services</div>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="new-service-input" placeholder="e.g. ptp4l, aes67-daemon, shairport-sync" style="flex: 1; background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 10px; color: var(--text-bright); font-size: 12px;">
          <button id="btn-add-service" class="btn-action btn-small">+ Add Service</button>
        </div>
        <div id="services-list" style="display: flex; flex-wrap: wrap;"></div>
      </div>
    </div>
  </div>

  <!-- SDK: the contract's browser bundle (window.APKContracts: topic builders, presence rule). -->
  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <!-- API: the shell's one softapp bus helper (window.APKBus). Absent off the bench: the panel says so. -->
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <!-- The one softapp client: CAD host@1 bridge (cad.like.audio/host@1), esc (window.APKSoftapp). -->
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/computerApp.js"></script>
</body>
</html>
