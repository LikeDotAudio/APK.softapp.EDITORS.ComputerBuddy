<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer & Server Node Buddy</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .split-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
      padding: 16px;
      overflow: hidden;
    }
    .panel {
      background: var(--surface-primary, #121A2F);
      border: 1px solid var(--border-color, #1E2A45);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0E1424);
      border-bottom: 1px solid var(--border-color, #1E2A45);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #F0F4F8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .field-group {
      margin-bottom: 12px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #8B9BB4);
      margin-bottom: 5px;
    }
    .field-group input, .field-group select {
      width: 100%;
      background: var(--surface-bg, #080C16);
      border: 1px solid var(--border-color, #1E2A45);
      border-radius: 4px;
      color: var(--text-bright, #F0F4F8);
      padding: 7px 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .svg-viewport {
      background: var(--surface-bg, #080C16);
      border-radius: 6px;
      border: 1px solid var(--border-color, #1E2A45);
      padding: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color, #1E2A45);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0E1424);
      color: var(--text-muted, #8B9BB4);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #1E2A45);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color, #1E2A45);
      color: var(--text-bright, #F0F4F8);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .service-badge {
      display: inline-flex;
      align-items: center;
      background: #1E2A45;
      border: 1px solid #2B3C5D;
      color: var(--text-bright, #F0F4F8);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin: 4px 6px 4px 0;
    }
    .badge-remove {
      background: none;
      border: none;
      color: #FF5A5A;
      font-size: 14px;
      font-weight: bold;
      margin-left: 6px;
      cursor: pointer;
      line-height: 1;
    }
    .badge-remove:hover {
      color: #FF8080;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🖥️</span>
      <span class="window-text">Computer & Server Node Buddy</span>
      <span id="block-tag" class="block-tag">COMPUTE NODE BLOCK</span>
    </div>
    <div class="window-actions">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- Properties sidebar -->
    <div class="panel">
      <div class="panel-header">
        <span>Hardware & Node Spec</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <label>Hostname / Node ID</label>
          <input type="text" id="prop-hostname" value="SRV-AUD-01">
        </div>
        <div class="field-group">
          <label>Chassis / Form Factor</label>
          <select id="prop-formFactor">
            <option value="1U Rackmount">1U Rackmount</option>
            <option value="2U Rackmount">2U Rackmount</option>
            <option value="4U Rackmount">4U Rackmount</option>
            <option value="Blade Node">Blade Node</option>
            <option value="Mini-PC / NUC">Mini-PC / NUC</option>
            <option value="Virtual Machine / LXC">Virtual Machine / LXC</option>
          </select>
        </div>
        <div class="field-group">
          <label>Operating System</label>
          <input type="text" id="prop-os" value="Debian 12 Bookworm">
        </div>
        <div class="field-group">
          <label>CPU Processor</label>
          <input type="text" id="prop-cpu" value="AMD EPYC 7302P 16-Core">
        </div>
        <div class="field-group">
          <label>System RAM</label>
          <input type="text" id="prop-ram" value="64 GB ECC DDR4">
        </div>
        <div class="field-group">
          <label>GPU Acceleration</label>
          <input type="text" id="prop-gpu" value="None (Headless)">
        </div>
        <div class="field-group">
          <label>Storage Array</label>
          <input type="text" id="prop-storage" value="2x 1TB NVMe RAID-1">
        </div>
        <div class="field-group">
          <label>Max Power Budget (Watts)</label>
          <input type="number" id="prop-powerWatts" value="250">
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="panel">
      <div class="panel-header">
        <span id="display-node-title">Node Network Interfaces & Daemons</span>
        <button id="btn-add-iface" class="btn-action btn-small">+ Add Interface</button>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="chassis-svg" class="svg-viewport"></div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Network Interfaces & VLANs</div>
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 12%;">IFace</th>
                <th style="width: 20%;">IP Address</th>
                <th style="width: 18%;">Subnet Mask</th>
                <th style="width: 20%;">MAC Address</th>
                <th style="width: 12%;">Speed</th>
                <th style="width: 10%;">Role</th>
                <th style="width: 8%;">VLAN</th>
                <th style="width: 5%; text-align: center;">Act</th>
              </tr>
            </thead>
            <tbody id="iface-table-body"></tbody>
          </table>
        </div>

        <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px; color: var(--text-bright);">Active Daemons & System Services</div>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="new-service-input" placeholder="e.g. ptp4l, aes67-daemon, shairport-sync" style="flex: 1; background: var(--surface-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 10px; color: var(--text-bright); font-size: 12px;">
          <button id="btn-add-service" class="btn-action btn-small">+ Add Service</button>
        </div>
        <div id="services-list" style="display: flex; flex-wrap: wrap;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/computerApp.js"></script>
</body>
</html>
